name: Alpha card cache

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Alpha∩perp coins to track (top by Alpha 24h volume)'
        required: false
        default: '60'
        type: choice
        options:
          - '40'
          - '60'
          - '100'

permissions:
  contents: write

concurrency:
  group: alpha-card-cache
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Collect Alpha card snapshot
        env:
          ALPHA_LIMIT: ${{ inputs.limit || '60' }}
        run: |
          python3 -m py_compile alpha-card-collector.py
          python3 alpha-card-collector.py \
            --limit "$ALPHA_LIMIT" \
            --output alpha-card-cache.json

      - name: Commit changed cache
        run: |
          git config user.name 'oi-radar-cache[bot]'
          git config user.email 'oi-radar-cache[bot]@users.noreply.github.com'
          git add alpha-card-cache.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'chore: refresh Alpha card cache'
            git push
          fi
