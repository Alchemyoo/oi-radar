name: OI radar cache

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Top quote-volume symbols to collect'
        required: false
        default: '50'
        type: choice
        options:
          - '50'
          - '100'

permissions:
  contents: write

concurrency:
  group: oi-radar-cache
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install collector dependencies
        run: python3 -m py_compile oi-cache-collector.py

      - name: Collect official Binance OI cache
        env:
          CACHE_LIMIT: ${{ inputs.limit || '50' }}
        run: |
          python3 oi-cache-collector.py \
            --limit "$CACHE_LIMIT" \
            --output oi-radar-live.json

      - name: Commit changed cache
        run: |
          git config user.name 'oi-radar-cache[bot]'
          git config user.email 'oi-radar-cache[bot]@users.noreply.github.com'
          git add oi-radar-live.json
          if git diff --cached --quiet; then
            echo 'Cache unchanged; no commit needed.'
          else
            git commit -m "chore: refresh OI radar cache"
            git push
          fi
