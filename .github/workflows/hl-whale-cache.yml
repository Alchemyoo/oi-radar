name: HL whale cache

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      users:
        description: 'Top accounts by accountValue to scan'
        required: false
        default: '1500'
        type: choice
        options:
          - '800'
          - '1500'
          - '2500'

permissions:
  contents: write

concurrency:
  group: hl-whale-cache
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Collect Hyperliquid whale snapshot
        env:
          HL_USERS: ${{ inputs.users || '1500' }}
        run: |
          python3 -m py_compile hl-whale-collector.py
          python3 hl-whale-collector.py \
            --users "$HL_USERS" \
            --output hl-whale-cache.json

      - name: Commit changed cache
        run: |
          git config user.name 'oi-radar-cache[bot]'
          git config user.email 'oi-radar-cache[bot]@users.noreply.github.com'
          git add hl-whale-cache.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'chore: refresh HL whale cache'
            git push
          fi
