<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transfer 事件证据</title><style>body{margin:0;background:#10141d;color:#e3e9f4;font:14px/1.6 system-ui;padding:20px}main{max-width:1080px;margin:auto}a{color:#77baff;overflow-wrap:anywhere}code{overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #354052;vertical-align:top;min-width:200px}button,select{font:inherit;padding:8px;background:#202b3e;color:#fff;border:1px solid #50617a;border-radius:6px}#evidence{margin-top:18px;background:#172131;padding:16px;border-radius:10px}p{overflow-wrap:anywhere}</style></head>
<body><main><a href="index.html">← 返回 OI 面板</a><h1>大额转账 · 独立证据</h1><p>仅使用既有已核实代币映射。此页重读缓存，不触发 RPC 扫描。未知/不可用不填零；无 verified 标签时只显示地址。</p><label>合约 <select id="token" disabled></select></label> <button id="reload" disabled>重读缓存</button><section id="evidence" aria-live="polite">加载合约注册表…</section></main><script src="transfers.js"></script><script>
(async()=>{
 const select=document.getElementById('token'),button=document.getElementById('reload'),box=document.getElementById('evidence');let tokens=[];
 try{
  const res=await fetch('onchain.registry.json');if(!res.ok)throw Error();const data=await res.json();
  if(data.schemaVersion!==1||!Array.isArray(data.tokens)||!data.tokens.length||data.tokens.length>20)throw Error();
  tokens=data.tokens.filter(t=>t.chain==='bsc'&&t.chainId===56&&/^0x[0-9a-f]{40}$/i.test(t.address)&&typeof t.symbol==='string'&&Array.isArray(t.sources)&&t.sources.length);
  if(tokens.length!==data.tokens.length)throw Error();
  for(const token of tokens){const o=document.createElement('option');o.textContent=token.symbol+' · '+token.address;o.value=token.symbol;select.append(o)}
  const reload=()=>mountTransferEvidence(box,tokens.find(t=>t.symbol===select.value));
  select.disabled=false;button.disabled=false;select.onchange=reload;button.onclick=reload;await reload();
 }catch(_){box.textContent='不可用：已核实合约注册表加载或校验失败。没有自动匹配替代币种。'}
})();
</script></body></html>
